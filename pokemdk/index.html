<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POKEMDK</title>
<meta name="apple-mobile-web-app-title" content="POKEMDK">
<meta name="application-name" content="POKEMDK">
<meta name="theme-color" content="#1d1f33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2d42; --paper:#fffdf5; --bg:#1d1f33; --panel:#272a45; --line:#3b3f63;
  --accent:#ffbe0b; --muted:#9aa0c3; --ok:#38b000;
  --pixel:'Press Start 2P', monospace; --sans:'Nunito', system-ui, sans-serif;
  --sky:
   radial-gradient(60px 26px at 18% 16%,#fff 60%,transparent 62%),
   radial-gradient(90px 30px at 24% 18%,#fff 60%,transparent 62%),
   radial-gradient(70px 24px at 70% 10%,rgba(255,255,255,.9) 60%,transparent 62%),
   linear-gradient(#8ecae6 0%,#cdeffd 46%,#a7d98a 46%,#7cc46a 72%,#5fae55 100%);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#eef0ff;font-family:var(--sans)}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -200px,#33386a 0%,transparent 70%),var(--bg)}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.6}
input,select{font-family:inherit}
[hidden]{display:none!important}

header{display:flex;align-items:center;gap:14px;padding:14px 22px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.brand{font-family:var(--pixel);font-size:20px;letter-spacing:1px;color:var(--accent);text-shadow:3px 3px 0 #c1121f;margin-right:auto;line-height:1.4}
.brand span{color:#fff;text-shadow:3px 3px 0 #3a0ca3}
.tabs{display:flex;gap:4px;background:var(--panel);padding:5px;border-radius:12px;border:2px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--muted);font-weight:800;padding:9px 14px;border-radius:8px;font-size:14px}
.tab.on{background:var(--accent);color:var(--ink)}
.icon-btn{border:2px solid var(--line);background:var(--panel);color:#fff;border-radius:10px;width:42px;height:42px;font-size:18px}
main{max-width:1100px;margin:0 auto;padding:0 22px 40px}

.panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:22px}
.panel h2{font-family:var(--pixel);font-size:16px;margin:0 0 18px;color:#fff;line-height:1.5}
.btn{border:2px solid var(--line);background:#33375a;color:#fff;border-radius:10px;padding:9px 14px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:#3d4270}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.primary{background:var(--accent);color:var(--ink);border-color:#e0a400}
.btn.primary:hover{background:#ffd043}
.btn.danger{background:#5a2233;border-color:#7d2c43}
.btn.danger.armed{background:#e63946;border-color:#e63946}
.link{background:none;border:0;color:#ff8fa3;font-weight:800;font-size:12px;text-decoration:underline;padding:2px}
.muted{color:var(--muted)} .small{font-size:12px}
.big-btn{display:block;margin:24px auto 0;font-family:var(--pixel);font-size:16px;padding:18px 34px;border-radius:14px;border:0;background:linear-gradient(#ff5d5d,#d62828);color:#fff;box-shadow:0 6px 0 #8d0801,0 10px 24px rgba(0,0,0,.35);transition:transform .08s}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8d0801}

/* ---------- preparación ---------- */
.sub{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.mode{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.mode button{border:2px solid var(--line);background:#33375a;color:#fff;padding:10px 18px;border-radius:999px;font-weight:800}
.mode button.on{background:#fff;color:var(--ink);border-color:#fff}
.arena-picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 22px}
.apick{background:#1f2240;border:3px solid var(--line);border-radius:12px;padding:8px;color:#fff;text-align:left}
.apick.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,190,11,.25)}
.apick b{display:block;font-size:13px;margin-top:6px}
.apick small{color:var(--muted);font-size:11px}
.athumb{aspect-ratio:16/10;border-radius:8px;background:center/cover no-repeat;position:relative;overflow:hidden}
.athumb .vtag{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;font-weight:800;padding:2px 5px;border-radius:5px}
.default-sky{background:var(--sky)}
.pickers{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:start}
.vs{font-family:var(--pixel);font-size:28px;color:var(--accent);text-shadow:3px 3px 0 #c1121f;align-self:center}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pick{position:relative;background:#1f2240;border:3px solid var(--line);border-radius:12px;padding:10px;color:#fff;text-align:center}
.pick img{width:100%;height:90px;object-fit:contain;filter:drop-shadow(0 4px 3px rgba(0,0,0,.4))}
.pick b{display:block;margin-top:6px;font-size:14px}
.pick small{color:var(--muted);font-size:11px}
.pick.on{border-color:var(--accent);background:#2d2a3c;box-shadow:0 0 0 3px rgba(255,190,11,.25)}
.pick .badge{position:absolute;top:6px;right:6px;background:var(--accent);color:var(--ink);font-weight:800;font-size:11px;border-radius:999px;padding:3px 7px}
.pick .mega-dot{position:absolute;top:6px;left:6px;font-size:14px}
.empty{text-align:center;padding:30px}
.on-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.on-card{background:#1f2240;border:2px solid var(--line);border-radius:14px;padding:16px}
.on-card h3{margin:0 0 8px;font-size:16px}
.on-code{font-family:var(--pixel);font-size:30px;color:var(--accent);letter-spacing:8px;text-shadow:3px 3px 0 #c1121f;margin:6px 0}
.on-status{font-weight:800;margin:8px 0}
.on-status.ok{color:#80ed99}.on-status.wait{color:var(--accent)}.on-status.bad{color:#ff8fa3}
.on-games{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.on-team{display:flex;gap:8px;flex-wrap:wrap;min-height:60px;align-items:center}
.on-team img{height:56px;width:56px;object-fit:contain;background:#2b2f55;border-radius:8px}
.on-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.on-row input{max-width:160px;text-transform:uppercase;letter-spacing:4px;font-weight:800}

/* ---------- arena ---------- */
.battle-wrap{max-width:980px;margin:0 auto}
.arena{position:relative;aspect-ratio:16/10;width:100%;overflow:hidden;border-radius:16px 16px 0 0;border:4px solid var(--ink);border-bottom:0;background:var(--sky);container-type:inline-size;--pc:#8cc97a}
.arena::after{content:"";position:absolute;inset:46% 0 0;background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(255,255,255,.06) 38px 40px);pointer-events:none}
.arena.custom::after{display:none}
.arena.mini{border-radius:12px;border:3px solid var(--ink)}
.bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
.plat{position:absolute;z-index:1;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--pc) 55%,#fff) 0%,var(--pc) 55%,color-mix(in srgb,var(--pc) 70%,#000) 100%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.plat.img{background:center/100% 100% no-repeat;border-radius:0;box-shadow:none}
.plat1{right:6%;top:35%;width:36%;height:11%}
.plat0{left:2%;bottom:3%;width:46%;height:14%}
.doubles .plat1{right:2%;width:46%}
.doubles .plat0{width:54%}
.sprite{position:absolute;display:flex;align-items:flex-end;justify-content:center;z-index:2}
.idle{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;width:100%;height:100%;transform-origin:50% 100%}
.chargeaura{position:absolute;left:-14%;right:-14%;top:-4%;bottom:-8%;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,color-mix(in srgb,var(--c) 60%,transparent) 0%,color-mix(in srgb,var(--c) 25%,transparent) 45%,transparent 68%);animation:auraPulse 1s ease-in-out infinite}
@keyframes auraPulse{50%{transform:scale(1.12);opacity:.65}}
.chargeimg{position:absolute;left:50%;top:-20%;width:38%;max-width:none;transform:translateX(-50%);z-index:4;pointer-events:none;filter:drop-shadow(0 0 10px var(--c));animation:stBob 1.4s ease-in-out infinite}
.sprite img{max-width:100%;max-height:100%;transform:scaleX(var(--flip,1));transform-origin:50% 100%;filter:drop-shadow(0 8px 4px rgba(0,0,0,.25))}
.pos-10{right:13%;top:4%;width:22%;height:37%}
.pos-00{left:9%;bottom:9%;width:30%;height:46%}
.doubles .pos-10{right:25%;top:3%;width:18%;height:33%}
.doubles .pos-11{right:5%;top:9%;width:19%;height:34%;z-index:3}
.doubles .pos-00{left:3%;bottom:10%;width:24%;height:40%}
.doubles .pos-01{left:25%;bottom:4%;width:25%;height:41%;z-index:3}
.idle-breathe{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.035) scaleX(.985)}}
.idle-float{animation:floaty 2.6s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-6%)}}
.idle-bounce{animation:bouncy .9s cubic-bezier(.5,0,.5,1) infinite}
@keyframes bouncy{50%{transform:translateY(-4%)}}
.idle-sway{animation:sway 3s ease-in-out infinite}
@keyframes sway{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}

.hud{position:absolute;z-index:4;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px 4px 14px 4px;padding:1.1cqw 1.6cqw;width:39%;box-shadow:5px 5px 0 rgba(0,0,0,.25);font-family:var(--pixel);font-size:clamp(7px,1.45cqw,13px);transition:opacity .3s,outline-color .2s;outline:3px solid transparent;outline-offset:2px}
.hud.active{outline-color:var(--accent)}
.hud.down{opacity:.45!important}
.hpos-10{left:4%;top:5%}
.hpos-00{right:4%;bottom:8%}
.doubles .hud{width:35%;padding:.7cqw 1.2cqw;font-size:clamp(6px,1.2cqw,11px);border-width:2px}
.doubles .hpos-10{left:3%;top:3%}
.doubles .hpos-11{left:3%;top:19%}
.doubles .hpos-00{right:3%;bottom:25%}
.doubles .hpos-01{right:3%;bottom:5%}
.hud-name{display:flex;justify-content:space-between;gap:8px;margin-bottom:.8cqw;white-space:nowrap;overflow:hidden}
.hud-name .n{overflow:hidden;text-overflow:ellipsis}
.hpbar{display:flex;align-items:center;gap:.8cqw}
.hpbar b{color:#e85d04;font-size:.85em}
.track{flex:1;height:clamp(6px,1.2cqw,12px);background:#3d405b;border-radius:8px;overflow:hidden;border:2px solid var(--ink)}
.fill{height:100%;width:100%;background:var(--ok);transition:width .6s ease,background-color .3s}
.fill.mid{background:#ffbe0b}.fill.low{background:#e63946}
.hp-row{display:flex;justify-content:space-between;align-items:center;margin-top:.7cqw;gap:6px}
.hp-num{font-size:.9em;margin-left:auto}
.stages{display:flex;gap:3px;flex-wrap:wrap}
.chip{font-size:.72em;padding:2px 4px;border-radius:4px;background:#e63946;color:#fff}
.chip.down{background:#457b9d}

.proj,.fximg{position:absolute;left:0;top:0;pointer-events:none;z-index:6;will-change:transform;max-width:none}
.fximg{z-index:7}
.ghost{z-index:5;opacity:.45;animation:ghost .38s linear forwards}
@keyframes ghost{to{opacity:0}}
.particle{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:8;animation:burst .55s ease-out forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
.ring{position:absolute;width:22px;height:22px;border:4px solid var(--c);border-radius:50%;pointer-events:none;z-index:8;animation:ring .45s ease-out forwards}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(5);opacity:0}}
.sparkle{position:absolute;width:9px;height:9px;background:var(--c);border-radius:50%;box-shadow:0 0 10px var(--c);pointer-events:none;z-index:8;opacity:0;animation:rise .9s ease-out forwards}
@keyframes rise{0%{transform:translate(-50%,0) scale(.4);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-95px) scale(1.2);opacity:0}}
.arrow{position:absolute;z-index:8;pointer-events:none;font-size:clamp(14px,2.4cqw,24px);text-shadow:0 0 2px #fff,0 2px 0 rgba(0,0,0,.35);opacity:0;transform:translate(-50%,0)}
.arrow.up{animation:arrUp .9s ease-out forwards}
.arrow.down{animation:arrDown .9s ease-in forwards}
@keyframes arrUp{0%{opacity:0;transform:translate(-50%,0)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-90px)}}
@keyframes arrDown{0%{opacity:0;transform:translate(-50%,0)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,90px)}}
.aura{position:absolute;z-index:1;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--c) 0%,transparent 65%);opacity:0;transform:translate(-50%,-50%)}
.float{position:absolute;z-index:9;pointer-events:none;font-family:var(--pixel);font-size:clamp(12px,2.2cqw,22px);color:#fff;text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 4px 0 var(--ink);transform:translate(-50%,0);animation:floatUp 1.1s ease-out forwards;white-space:nowrap}
.float.crit{color:#ffbe0b;font-size:clamp(14px,2.8cqw,28px)}
.float.heal{color:#80ed99}.float.miss{color:#ced4da}
@keyframes floatUp{0%{transform:translate(-50%,10px) scale(.6);opacity:0}15%{transform:translate(-50%,0) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-50px) scale(1);opacity:0}}
.shield{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,-50%);max-width:none}
div.shield{border-radius:50%;border:3px solid var(--c);background:radial-gradient(circle,transparent 52%,color-mix(in srgb,var(--c) 30%,transparent) 72%,color-mix(in srgb,var(--c) 65%,#fff) 100%);box-shadow:0 0 18px var(--c),inset 0 0 18px var(--c)}
img.shield{object-fit:contain;opacity:.92;filter:drop-shadow(0 0 10px var(--c))}
.scr{position:absolute;inset:0;z-index:25;pointer-events:none;opacity:0}
/* estados alterados */
.has-st img{filter:drop-shadow(0 8px 4px rgba(0,0,0,.25)) drop-shadow(0 0 8px var(--stc))}
.st-sleep .idle{animation-duration:5s!important}
.st-sleep img{filter:drop-shadow(0 8px 4px rgba(0,0,0,.25)) drop-shadow(0 0 8px var(--stc)) brightness(.85)}
.st-confusion .idle{animation:stWobble 1.4s ease-in-out infinite!important}
@keyframes stWobble{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.stfx{position:absolute;inset:0;pointer-events:none;z-index:3}
.stfx > img{position:absolute;left:50%;top:-8%;width:32%;max-width:none;transform:translateX(-50%);filter:none;animation:stBob 1.6s ease-in-out infinite}
@keyframes stBob{50%{transform:translate(-50%,-14%)}}
.stfx-poison i{position:absolute;bottom:22%;width:8%;aspect-ratio:1;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);opacity:0;animation:stBubble 2.2s ease-in infinite}
.stfx-poison i:nth-child(1){left:24%}.stfx-poison i:nth-child(2){left:52%;animation-delay:.7s}.stfx-poison i:nth-child(3){left:74%;animation-delay:1.4s}
@keyframes stBubble{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:.9}100%{opacity:0;transform:translateY(-70px) scale(1.1)}}
.stfx-paralysis b{position:absolute;font-size:clamp(12px,2.4cqw,26px);color:var(--c);opacity:0;text-shadow:0 0 6px #fff;animation:stZap 1.8s steps(1) infinite}
.stfx-paralysis b:nth-child(1){left:4%;top:30%}.stfx-paralysis b:nth-child(2){right:4%;top:55%;animation-delay:.9s}
@keyframes stZap{0%{opacity:1}10%{opacity:0}18%{opacity:1}26%,100%{opacity:0}}
.stfx-sleep span{position:absolute;left:62%;top:4%;font-family:var(--pixel);color:var(--c);font-size:clamp(9px,1.8cqw,18px);opacity:0;text-shadow:0 0 3px #fff,0 0 3px #fff;animation:stZ 2.4s ease-out infinite}
.stfx-sleep span:nth-child(2){animation-delay:.8s}.stfx-sleep span:nth-child(3){animation-delay:1.6s;font-size:clamp(12px,2.4cqw,24px)}
@keyframes stZ{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(32px,-55px)}}
.stfx-confusion .orbit{position:absolute;left:50%;top:-2%;width:50%;height:16%;transform:translateX(-50%)}
.stfx-confusion b{position:absolute;color:var(--c);font-size:clamp(10px,2cqw,22px);text-shadow:0 0 3px #fff,0 0 3px #fff;transform:translate(-50%,-50%);animation:stOrbit 1.5s linear infinite}
.stfx-confusion b:nth-child(2){animation-delay:-.5s}.stfx-confusion b:nth-child(3){animation-delay:-1s}
@keyframes stOrbit{0%{left:0%;top:50%}25%{left:50%;top:100%}50%{left:100%;top:50%}75%{left:50%;top:0%}100%{left:0%;top:50%}}
.glyph{position:absolute;z-index:9;pointer-events:none;font-weight:800;color:var(--c);text-shadow:0 0 4px #fff,0 2px 0 rgba(0,0,0,.3);font-size:clamp(14px,2.6cqw,28px);transform:translate(-50%,-50%);opacity:0;animation:glyphUp 1.1s ease-out forwards}
@keyframes glyphUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% - 60px)) scale(1)}}
.stcard{background:#1f2240;border:2px solid var(--line);border-left:8px solid var(--c);border-radius:12px;padding:12px;margin-bottom:10px}
.stcard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.stcard-head b{font-size:15px}
.trans{position:absolute;inset:0;z-index:30;pointer-events:none;display:flex;flex-direction:column}
.trans .bar{flex:1;background:#111}
.trans.white{background:#fff}

.result{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(20,20,40,.55);backdrop-filter:blur(2px)}
.result .rcard{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:16px;padding:22px 26px;text-align:center;box-shadow:8px 8px 0 rgba(0,0,0,.3);animation:pop .4s cubic-bezier(.2,1.6,.4,1);max-width:90%}
.result h3{font-family:var(--pixel);font-size:clamp(11px,2.3cqw,20px);margin:0 0 8px;line-height:1.6}
.result .wimgs{display:flex;gap:10px;justify-content:center}
.result img{height:clamp(50px,13cqw,110px);margin:6px 0 10px}
.result .row{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

.box{display:grid;grid-template-columns:1fr 1.15fr;gap:10px;background:var(--ink);padding:12px;border-radius:0 0 16px 16px;border:4px solid var(--ink);border-top:0;min-height:156px}
.msg{background:var(--paper);color:var(--ink);border:4px solid #8d99ae;border-radius:10px;padding:16px;font-family:var(--pixel);font-size:clamp(10px,1.4vw,13px);line-height:1.8;cursor:pointer;user-select:none}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.move{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-left:12px solid var(--c,#8d99ae);border-radius:10px;text-align:left;padding:9px 11px;font-family:var(--pixel);font-size:clamp(9px,1.1vw,11px);line-height:1.4;transition:transform .08s,background .15s}
.move:hover{background:#fff3c4;transform:translateY(-2px)}
.move small{display:block;font-family:var(--sans);font-size:12px;font-weight:600;color:#6c757d;margin-top:6px}
.move.mega{grid-column:1/-1;--c:#c77dff;background:linear-gradient(90deg,#f3e8ff,#fffdf5)}
.move.mega.on{background:linear-gradient(90deg,#7b2cbf,#c77dff);color:#fff}
.move.mega.on small{color:#f3e8ff}
.move.back{grid-column:1/-1;--c:#adb5bd;padding:7px 11px}
.move.target{display:flex;flex-direction:column}
.move.target img{height:44px;object-fit:contain;align-self:flex-start;margin-bottom:4px}
.moves.disabled .move{opacity:.45;pointer-events:none}
.battle-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap}

/* ---------- editor ---------- */
.ed-grid{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}
.ed-grid > *{min-width:0}
.ed-list{position:sticky;top:12px;display:flex;flex-direction:column;gap:8px}
.fitem{display:flex;align-items:center;gap:10px;background:#1f2240;border:2px solid var(--line);border-radius:12px;padding:8px;color:#fff;text-align:left;width:100%}
.fitem img,.fitem .athumb{width:52px;height:52px;object-fit:contain;background-color:#2b2f55;border-radius:8px;flex:none}
.fitem .athumb{width:64px;height:40px}
.fitem b{display:block;font-size:14px}
.fitem small{color:var(--muted);font-size:12px}
.fitem.on{border-color:var(--accent);background:#2d2a3c}
.io{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.io .btn{flex:1;font-size:12px;padding:8px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.card > h3{margin:0 0 14px;font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top{display:grid;grid-template-columns:200px 1fr;gap:18px}
label{font-size:13px;font-weight:700;color:#cfd3f2}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.fields > label,.grid3 > label,.grid4 > label,.trim-grid > label{display:flex;flex-direction:column;gap:5px}
.full{grid-column:1/-1}
input[type=text],input[type=number],select{background:#1a1c33;border:2px solid var(--line);color:#fff;border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:100%;height:38px;border:2px solid var(--line);border-radius:8px;background:#1a1c33;padding:2px}
.stat-row{display:flex;justify-content:space-between;gap:6px}
.stat-row output{font-family:var(--pixel);font-size:10px;color:var(--accent);white-space:nowrap}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.slots{display:flex;gap:14px;flex-wrap:wrap}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed #5b6199;border-radius:12px;background:repeating-conic-gradient(#23264a 0% 25%,#1d2040 0% 50%) 0 0/20px 20px;cursor:pointer;text-align:center;padding:8px;transition:border-color .15s;overflow:hidden}
.drop,.file-btn{position:relative}
.file-hit{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop img{max-width:100%;object-fit:contain}
.drop span{font-size:11px;color:var(--muted);font-weight:700}
.drop .noimg{font-size:11px;color:#6b70a3;font-style:normal}
.drop.big{height:200px;width:100%}.drop.big img{height:150px}
.drop.small{height:112px;width:112px}.drop.small img{height:64px}
.drop.wide{height:150px;width:100%}.drop.wide img{height:110px;width:100%;object-fit:cover;border-radius:6px}
.pv-card{position:sticky;top:8px;z-index:10;padding:10px}
.pv{position:relative;height:190px;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:linear-gradient(#8ecae6 0%,#cdeffd 60%,#a7d98a 60%,#7cc46a 100%)}
.pv .sprite{bottom:12px;height:140px;width:150px}
.pv-a{left:6%}.pv-b{right:6%}
.pv-label{position:absolute;left:10px;top:8px;font-family:var(--pixel);font-size:9px;color:var(--ink);background:rgba(255,255,255,.75);padding:5px 7px;border-radius:6px;z-index:3}
.atk{background:#1f2240;border:2px solid var(--line);border-left:8px solid var(--c);border-radius:12px;padding:12px;margin-bottom:10px}
.atk-head{display:grid;grid-template-columns:1fr 230px auto auto;gap:8px;align-items:center;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 14px}
.sec{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.sec-t{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800;margin-bottom:8px}
.imgrow{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:start}
.check{display:flex!important;flex-direction:row!important;align-items:center;gap:8px!important}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.aslot{display:flex;flex-direction:column;gap:6px;min-width:0}
.aslot .lbl{font-size:13px;font-weight:700;color:#cfd3f2}
.arow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.arow .ok{color:#80ed99;font-size:12px;font-weight:800}
.trim{background:#181a30;border:1px solid var(--line);border-radius:10px;padding:8px}
.wave{width:100%;height:52px;display:block;border-radius:6px;background:#12142a}
.trim-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.trim .dur{display:block;margin-top:4px}
.audios{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vfx-row{display:grid;grid-template-columns:1.1fr 1.4fr 1fr 74px auto;gap:6px;margin-bottom:6px;align-items:center}
.vfx-row select{padding:6px 8px;font-size:13px}
.danger-row{display:flex;gap:8px;justify-content:flex-end}
.tip{font-size:13px;color:var(--muted);margin:-6px 0 14px}
.note{font-size:12px;color:var(--muted);margin:0}

.modal{position:fixed;inset:0;background:rgba(10,10,25,.7);display:grid;place-items:center;z-index:100;padding:20px;overflow-y:auto}
.modal .card{width:min(620px,100%);margin:0}
.modal .card.wide{width:min(880px,100%)}
.vc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.vc-grid video,.vc-grid canvas{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:#000;display:block}
.vc-grid video{cursor:crosshair}
.checker{background:repeating-conic-gradient(#cfd3e6 0 25%,#fff 0 50%) 0 0/16px 16px!important}
.progress{height:10px;background:#1a1c33;border-radius:6px;overflow:hidden;margin-top:12px}
.progress div{height:100%;width:0;background:var(--accent);transition:width .15s}
.modal textarea{width:100%;height:200px;background:#14162b;color:#cfd3f2;border:2px solid var(--line);border-radius:10px;padding:10px;font-family:monospace;font-size:12px;resize:vertical}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:var(--paper);color:var(--ink);font-weight:800;padding:12px 18px;border-radius:12px;border:3px solid var(--ink);transition:transform .3s;z-index:200;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:820px){
  main{padding:0 12px 40px}
  header{padding:12px;gap:10px}
  .brand{font-size:12px}
  .tabs{order:3;width:100%;flex-wrap:nowrap}
  .tab{flex:1;padding:9px 4px;font-size:12px;white-space:nowrap}
  .panel{padding:14px}
  .card{padding:14px}
  .ed-grid{grid-template-columns:minmax(0,1fr)}.ed-list{position:static}
  input[type=text],input[type=number],select{font-size:16px}
  .fields{grid-template-columns:1fr}
  .imgrow{grid-template-columns:1fr;justify-items:start}
  .imgrow > .grid3{width:100%}
  .grid3 > *,.grid4 > *{min-width:0}
  .pv-card{position:fixed;left:8px;right:8px;bottom:8px;top:auto;margin:0;z-index:60;box-shadow:0 10px 40px rgba(0,0,0,.6);transform:translateY(calc(100% + 20px));transition:transform .25s ease;pointer-events:none}
  .pv-card.show{transform:none;pointer-events:auto}
  .pv{height:170px}
  .pv .sprite{height:120px;width:120px}
  .top{grid-template-columns:1fr}
  .atk-head{grid-template-columns:1fr 1fr}
  .grid3,.grid4{grid-template-columns:1fr 1fr}
  .audios{grid-template-columns:1fr}
  .vfx-row{grid-template-columns:1fr 1fr;padding:8px;border:1px dashed var(--line);border-radius:10px;margin-bottom:8px}
  .vfx-row select{font-size:16px}
  .trim-grid{grid-template-columns:1fr}
  .pickers{grid-template-columns:1fr}.vs{text-align:center}
  .on-grid{grid-template-columns:1fr}
  .modal{place-items:start center;overflow-y:auto}
  .vc-grid{gap:8px}
  .vc-grid video,.vc-grid canvas{max-height:150px}
  .box{grid-template-columns:1fr}
}

<body>
<header>
  <div class="brand">POKE<span>MDK</span></div>
  <nav class="tabs">
    <button class="tab on" data-view="battle">⚔️ Combate</button>
    <button class="tab" data-view="editor">🛠️ Personajes</button>
    <button class="tab" data-view="arenas">🏟️ Escenarios y sonido</button>
  </nav>
  <button class="icon-btn" id="soundBtn" title="Silenciar / activar sonido">🔊</button>
</header>

<main>
  <!-- ============ COMBATE ============ -->
  <section id="view-battle">
    <div id="setup" class="panel">
      <h2>Prepara el combate</h2>
      <div class="mode" id="modeRow">
        <button data-mode="cpu" class="on">🤖 Contra la CPU</button>
        <button data-mode="pvp">🎮 2 jugadores (mismo dispositivo)</button>
        <button data-mode="online">🌐 Online</button>
      </div>
      <div class="mode" id="formatRow">
        <button data-format="single" class="on">👤 Individual (1 vs 1)</button>
        <button data-format="double">👥 Por parejas (2 vs 2)</button>
      </div>
      <div id="pickArea">
        <h3 class="sub">Escenario</h3>
        <div class="arena-picks" id="arenaPick"></div>
        <div class="pickers">
          <div><h3 class="sub"><span id="p0Title">Jugador 1</span><button class="link" data-clear="0" hidden>Vaciar</button></h3><div class="pick-grid" id="pick0"></div></div>
          <div class="vs">VS</div>
          <div><h3 class="sub"><span id="p1Title">Rival (CPU)</span><button class="link" data-clear="1" hidden>Vaciar</button></h3><div class="pick-grid" id="pick1"></div></div>
        </div>
        <button class="big-btn" id="startBtn">¡A COMBATIR!</button>
      </div>
      <div id="onlineArea" hidden></div>
      <div id="noFighters" class="empty" hidden>
        <p>No tienes personajes todavía.</p>
        <button class="btn primary" data-goto="editor">Crear mi primer personaje</button>
      </div>
    </div>

    <div id="battle" class="battle-wrap" hidden>
      <div class="arena" id="arena">
        <div class="plat plat1"></div>
        <div class="plat plat0"></div>
        <div class="result" id="result" hidden>
          <div class="rcard">
            <h3 id="resultTitle"></h3>
            <div class="wimgs" id="resultImgs"></div>
            <div class="row">
              <button class="btn primary" id="rematchBtn">🔁 Revancha</button>
              <button class="btn" id="backBtn">Elegir otros luchadores</button>
            </div>
          </div>
        </div>
      </div>
      <div class="box">
        <div class="msg" id="msg" title="Haz clic para acelerar el texto"></div>
        <div class="moves" id="moves"></div>
      </div>
      <div class="battle-foot">
        <button class="btn" id="fleeBtn">⟵ Salir del combate</button>
        <span class="muted small">Consejo: toca el cuadro de texto para acelerarlo.</span>
      </div>
    </div>
  </section>

  <!-- ============ PERSONAJES ============ -->
  <section id="view-editor" hidden>
    <div class="ed-grid">
      <aside class="ed-list">
        <button class="btn primary" id="newF">+ Nuevo personaje</button>
        <div id="fList" style="display:flex;flex-direction:column;gap:8px"></div>
        <div class="io">
          <button class="btn" data-io="export">⬆ Exportar</button>
          <button class="btn" data-io="import">⬇ Importar</button>
          <button class="btn danger" data-io="reset">Restaurar demo</button>
        </div>
      </aside>
      <div id="fForm"></div>
    </div>
  </section>

  <!-- ============ ESCENARIOS ============ -->
  <section id="view-arenas" hidden>
    <div class="ed-grid">
      <aside class="ed-list">
        <button class="btn primary" id="newA">+ Nuevo escenario</button>
        <div id="aList" style="display:flex;flex-direction:column;gap:8px"></div>
        <div class="io">
          <button class="btn" data-io="export">⬆ Exportar</button>
          <button class="btn" data-io="import">⬇ Importar</button>
        </div>
      </aside>
      <div id="aForm"></div>
    </div>
  </section>
</main>

<div class="modal" id="modal" hidden><div class="card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>

function startSynth() {
  const ctx = ac();

  master.gain.value = S.settings.musicVol * .5;
  master.connect(ctx.destination);

  };

    while (next < ctx.currentTime + .2) {
      const m = MEL[step];
      if (m) note(m, next, spb * 1.8, 'square', .05);
      if (step % 2 === 0) note(BASS[Math.floor(step / 16)] + (step % 4 === 2 ? 12 : 0), next, spb * 1.7, 'triangle', .16);

/* ----- resolución ----- */
function resolveTargets(C, m, chosen) {

}
async function doTransform(C) {

async function resolveTurn(actions) {

    if (a.C.fainted) continue;

  actions.sort((x, y) => (y.p - x.p) || (sp(y) - sp(x)) || (x.r - y.r));
  for (const a of actions) {

      else { hideAura(a.C); await say(`¡${a.C.label} ha perdido la energía acumulada!`); }
    }

    const w = winnerSide();
    if (w !== null) return endBattle(w);
  }
  const cfg = S.settings.status;
  for (const U of B.units) {
    if (U.fainted || U.status !== 'poison') continue;
    const dmg = Math.max(1, Math.round(U.max * cfg.poisonPct / 100));
    await withAudioWait(() => statusAnim($('#arena'), U, 'poison', 'tick'));
    setHP(U, Math.max(0, U.hp - dmg));
    floatText($('#arena'), U.img, '-' + dmg, 'miss');

    await say(`${U.label} está ${cfg.poison.adj}: pierde ${dmg} PS.`);

  { const w = winnerSide(); if (w !== null) return endBattle(w); }
  await endTurn();

}
function setHP(C, v) {

  const t0 = performance.now();
  const step = n => {
    const t = Math.min(1, (n - t0) / 600);

}

      sfx(outs.includes('block') ? 'block' : 'miss');

  }

    floatText(c, A.img, '-' + lost, 'miss');

  }
  if (m.fx.stat !== 'none' && outs.includes('hit')) {

function drawWave(cv, info, trim) {
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height, n = info.peaks.length;
  ctx.clearRect(0, 0, W, H);
  const s = trim.start / info.dur, e = (trim.end || info.dur) / info.dur;
  for (let i = 0; i < n; i++) {
    const f = i / n, h = Math.max(2, info.peaks[i] * H * .9);
    ctx.fillStyle = f >= s && f <= e ? '#ffbe0b' : '#454a7a';
    ctx.fillRect(f * W, (H - h) / 2, Math.max(1, W / n - 1), h);
  }
  ctx.fillStyle = '#fff';
  ctx.fillRect(s * W, 0, 2, H); ctx.fillRect(Math.min(W - 2, e * W), 0, 2, H);
}
function trimText(info, trim) {

}
async function hydrateTrims(root) {
  for (const box of $$('.trim', root)) {
    const key = box.dataset.trimKey, t = target(key); if (!t) continue;
    const ref = t[0][t[1]];
    try {
      const info = await audioInfo(ref);
      if (!box.isConnected) continue;
      const trim = t[0][t[1] + 'Trim'] || { start: 0, end: 0, vol: 1 };
      box.dataset.dur = info.dur;
      const s = $('[data-trim="start"]', box), e = $('[data-trim="end"]', box);
      s.max = e.max = info.dur.toFixed(2);
      s.value = Math.min(trim.start, info.dur);
      e.value = trim.end || info.dur;
      $('[data-o="start"]', box).textContent = fmtSec(+s.value);
      $('[data-o="end"]', box).textContent = fmtSec(+e.value);
      $('.dur', box).textContent = trimText(info, trim);
      drawWave($('canvas', box), info, trim);
    } catch (err) {

    }

}
function onTrimInput(el) {
  const box = el.closest('.trim'), key = box.dataset.trimKey, t = target(key); if (!t) return;
  const info = WAVE[t[0][t[1]]], dur = info ? info.dur : 0;
  const trim = t[0][t[1] + 'Trim'] || (t[0][t[1] + 'Trim'] = { start: 0, end: 0, vol: 1 });
  let v = Number(el.value);
  if (el.dataset.trim === 'start') {
    const end = trim.end || dur;
    if (dur && v > end - .05) { v = Math.max(0, end - .05); el.value = v; }
    trim.start = v;
    $('[data-o="start"]', box).textContent = fmtSec(v);
  } else if (el.dataset.trim === 'end') {
    if (v < trim.start + .05) { v = trim.start + .05; el.value = v; }
    trim.end = dur && v >= dur - .01 ? 0 : v;
    $('[data-o="end"]', box).textContent = fmtSec(v);
  } else {
    trim.vol = clamp(v / 100, 0, 1);
    $('[data-o="vol"]', box).textContent = v + '%';
  }
  if (info) { drawWave($('canvas', box), info, trim); $('.dur', box).textContent = trimText(info, trim); }
  save();
}

async function handleUpload(input, file) {
  const key = input.dataset.key, t = target(key), type = input.dataset.type;
  if (!t || !file) return;
  if (type === 'image' && isVideoFile(file) && key === 'ar:bg') {
    try { t[0].bgVideo = await putMedia(await readVideo(file)); save(true); rerenderFor(key); toast('Vídeo de fondo cargado ✔'); }
    catch (e) { toast('No se pudo cargar ese vídeo (máx. 80 MB)'); }
    return;
  }
  if (type === 'image' && isVideoFile(file)) {
    openVideoConverter(file, async (dataURL, size) => {
      t[0][t[1]] = await putMedia(dataURL);
      save(true); rerenderFor(key);
      toast(`Animación creada ✔ (${(size / 1048576).toFixed(1)} MB)`);
    });
    return;
  }
  toast({ audio: 'Cargando audio…', video: 'Cargando vídeo…' }[type] || 'Cargando imagen…');
  try {
    const data = type === 'audio' ? await readAudio(file) : type === 'video' ? await readVideo(file) : await readImage(file, IMG_MAX[key] || 240);
    t[0][t[1]] = await putMedia(data);
    if (type === 'audio') t[0][t[1] + 'Trim'] = null;
    save(true); rerenderFor(key);
    toast({ audio: 'Audio cargado ✔ Ahora puedes recortarlo', video: 'Vídeo cargado ✔' }[type] || 'Imagen cargada ✔');
  } catch (err) {
    const msg = { big: 'El audio es demasiado grande (máx. 25 MB)', bigimg: 'La imagen animada es demasiado grande (máx. 15 MB)', bigvideo: 'El vídeo es demasiado grande (máx. 80 MB)', video: 'Ese archivo no es un vídeo MP4/WebM', audio: 'No se pudo leer ese audio' }[err && err.message];
    toast(msg || 'No se pudo leer esa imagen');
  }
}
let previewAudio = null;
function stopPreviewAudio() { if (previewAudio) { previewAudio.pause(); clearTimeout(previewAudio._stop); previewAudio = null; } }
function editorCommon(root) {

/* =========================================================
   Combates online entre dispositivos (P2P con PeerJS)
   Tú eres el anfitrión: la partida usa tus personajes.
   ========================================================= */
const PEER_PREFIX = 'arenacombates-v1-';
const REMOTE = {};
const PEER_OPTS = (() => {
  const q = new URLSearchParams(location.search).get('peer');
  if (!q) return { debug: 0 };
  const [host, port] = q.split(':');
  return { debug: 0, host, port: +port || 9000, path: '/', secure: false };
})();
const O = { phase: 'idle', role: null, code: '', peer: null, conn: null, myTeam: [], opTeam: [], format: 'single', arenaId: null,
  ver: 0, sig: '', cfg: null, roster: null, incoming: null, pendingStart: null, deferStart: null, lastGid: null, busy: false, prog: 0, msg: '', timer: null };
const onNeed = () => O.format === 'double' ? 2 : 1;
const rosterSig = () => { const t = JSON.stringify({ f: S.fighters, a: S.arenas, s: S.settings.status }); let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return t.length + ':' + h; };
const randCode = () => { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; return Array.from({ length: 4 }, () => a[Math.floor(Math.random() * a.length)]).join(''); };
function openPeer(id) {
  return new Promise((res, rej) => {
    let p;
    try { p = id ? new Peer(id, PEER_OPTS) : new Peer(PEER_OPTS); } catch (e) { return rej(e); }
    const to = setTimeout(() => { try { p.destroy(); } catch (e) {} rej(new Error('timeout')); }, 15000);
    p.on('open', () => { clearTimeout(to); res(p); });
    p.on('error', e => { clearTimeout(to); rej(e); });
  });
}
async function send(msg) {
  const c = O.conn; if (!c || !c.open) return;
  try {
    const dc = c.dataChannel;
    while (dc && dc.bufferedAmount > 2 * 1048576) await wait(40);
    c.send(msg);
  } catch (e) {}
}
async function sendRoster() {
  const json = JSON.stringify({ fighters: S.fighters, arenas: S.arenas, status: S.settings.status });
  const ids = [...new Set([...json.matchAll(/"m:([a-z0-9]+)"/g)].map(x => x[1]))].filter(id => MEDIA[id]);
  O.ver = Date.now(); O.sig = rosterSig();
  const ver = O.ver;
  /* PeerJS solo entrega bien mensajes pequeños: todo va en trozos */
  const JC = 4000, jn = Math.max(1, Math.ceil(json.length / JC));
  await send({ t: 'roster', ver, parts: jn, media: ids.length });
  for (let i = 0; i < jn; i++) await send({ t: 'rj', ver, i, d: json.slice(i * JC, (i + 1) * JC) });
  for (const id of ids) {
    let v = MEDIA[id];
    if (v instanceof Blob) v = await blobToDataURL(v);
    const CH = 12000, n = Math.max(1, Math.ceil(v.length / CH));
    for (let i = 0; i < n; i++) await send({ t: 'm', ver, id, i, n, d: v.slice(i * CH, (i + 1) * CH) });
    if (O.ver !== ver) return;
  }
  await send({ t: 'rosterDone', ver });
}
const sendCfg = () => send({ t: 'cfg', format: O.format, arenaId: O.arenaId, hostTeam: O.myTeam, ver: O.ver });

        <div><h3 class="sub">Equipo del anfitrión</h3><div class="on-card"><div class="on-team">${teamThumbs(cfg.hostTeam || [], list)}</div></div></div>
      </div>
      <p class="on-status ${O.myTeam.length === n ? 'ok' : 'wait'}" style="text-align:center">${O.myTeam.length === n ? '✔ ¡Listo! Esperando a que el anfitrión empiece el combate…' : 'Elige tu equipo'}</p>` : O.msg ? `<p class="on-status bad" style="text-align:center">${esc(O.msg)}</p>` : ''}
      <p style="text-align:center;margin-top:12px"><button class="btn sm danger" data-on="close">Salir de la partida</button></p>`;
    return;
  }
  el.innerHTML = `
    <div class="on-grid">
      <div class="on-card"><h3>🏠 Ser el anfitrión</h3>
        <p class="note">Creas la partida con <b>tus personajes y escenarios</b>. Tu rival elige su equipo entre ellos y juega desde su dispositivo. No hace falta ninguna cuenta.</p>
        <button class="btn primary" data-on="host" style="margin-top:12px">Crear partida</button></div>
      <div class="on-card"><h3>🎮 Unirse a una partida</h3>
        <p class="note">Escribe el código que te ha dado el anfitrión.</p>
        <div class="on-row" style="margin-top:8px"><input type="text" id="codeIn" maxlength="4" placeholder="CÓDIGO"><button class="btn" data-on="joinCode">Unirse</button></div>
      </div>
    </div>
    ${O.msg ? `<p class="on-status bad" style="text-align:center">${esc(O.msg)}</p>` : ''}
    <p class="note" style="margin-top:12px">Los dos necesitáis conexión a internet y abrir este mismo enlace. La partida va directamente de un dispositivo al otro.</p>`;
}
function attachConn(conn) {
  O.conn = conn;
  conn.on('open', async () => {
    if (O.role === 'host') {
      sendCfg(); O.sending = true; renderOnline();
      await sendRoster(); await sendCfg();
      O.sending = false;
    }
    if (B.mode === 'online' && !B.online) renderOnline();
  });
  conn.on('data', onData);
  conn.on('close', () => {
    if (O.conn !== conn) return;
    O.conn = null;
    if (B.online && !B.online.ended) {
      B.online.ended = true; B.busy = false;
      $('#msg').textContent = 'Se ha perdido la conexión con tu rival.';
      $('#moves').innerHTML = ''; $('#fleeBtn').disabled = false;
      toast('Se ha perdido la conexión con tu rival');
    }
    if (O.role === 'host') { O.opTeam = []; O.pendingStart = null; }
    if (O.role === 'guest' && !B.online && O.phase === 'joined') { O.msg = O.msg || 'Se ha perdido la conexión con el anfitrión.'; closeOnline(true); return; }
    if (B.mode === 'online' && !B.online) renderOnline();
  });
}
let renderTimer = null;
const renderSoon = () => { if (renderTimer) return; renderTimer = setTimeout(() => { renderTimer = null; if (B.mode === 'online' && !B.online) renderOnline(); }, 150); };
async function onData(d) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'full' && O.role === 'guest') { O.msg = 'Esa partida ya tiene rival.'; return; }
  if (O.role === 'guest') {
    if (d.t === 'roster') { O.incoming = { ver: d.ver, jparts: [], jn: +d.parts || 1, total: +d.media || 0, got: 0, parts: {} }; return renderSoon(); }
    if (d.t === 'rj' && O.incoming && d.ver === O.incoming.ver && Number.isInteger(d.i)) { O.incoming.jparts[d.i] = String(d.d || ''); return; }
    if (d.t === 'm' && O.incoming && d.ver === O.incoming.ver && /^[a-z0-9]+$/.test(d.id)) {
      const p = O.incoming.parts[d.id] = O.incoming.parts[d.id] || { n: d.n, c: [], k: 0 };
      if (p.c[d.i] == null) { p.c[d.i] = String(d.d); p.k++; }
      if (p.k === p.n) { const v = p.c.join(''); if (v.startsWith('data:')) REMOTE[d.id] = v; delete O.incoming.parts[d.id]; O.incoming.got++; renderSoon(); }
      return;
    }
    if (d.t === 'rosterDone' && O.incoming && d.ver === O.incoming.ver) {
      try {
        const doc = JSON.parse(O.incoming.jparts.join('').replace(/"m:([a-z0-9]+)"/g, '"r:$1"'));
        O.roster = { fighters: (doc.fighters || []).map(normFighter), arenas: (doc.arenas || []).map(normArena), status: normStatusCfg(doc.status || {}), ver: d.ver };
        if (!O.roster.arenas.length) O.roster.arenas = defaultArenas();
      } catch (e) { O.msg = 'No se pudieron leer los personajes del anfitrión.'; }
      O.incoming = null;
      renderSoon();
      if (O.deferStart && O.deferStart.ver === O.roster.ver) { const sm = O.deferStart; O.deferStart = null; guestStart(sm); }
      return;
    }
    if (d.t === 'cfg') {
      O.cfg = { format: d.format === 'double' ? 'double' : 'single', arenaId: String(d.arenaId || ''), hostTeam: Array.isArray(d.hostTeam) ? d.hostTeam.slice(0, 2).map(String) : [], ver: d.ver };
      return renderSoon();
    }
    if (d.t === 'start') { if (O.roster && O.roster.ver === d.ver) guestStart(d); else O.deferStart = d; return; }
  } else {
    if (d.t === 'pick' && !B.online) {
      const n = onNeed(), team = (Array.isArray(d.team) ? d.team : []).map(String).filter(id => getF(id)).slice(0, 2);
      O.opTeam = team.length === n ? team : [];
      return renderSoon();
    }
    if (d.t === 'ready' && O.pendingStart && d.gid === O.pendingStart.gid) { const sm = O.pendingStart; O.pendingStart = null; launchOnline(sm); return; }
  }
  if (d.t === 'act') return onAct(d);
  if (d.t === 'bye') {
    if (B.online && !B.online.ended) {
      B.online.ended = true; B.busy = false;
      $('#msg').textContent = 'Tu rival ha abandonado la partida.';
      $('#moves').innerHTML = ''; $('#fleeBtn').disabled = false;
      toast('Tu rival ha abandonado la partida');
    } else if (O.role === 'host') { O.opTeam = []; renderSoon(); }
  }
}
function guestStart(d) {
  send({ t: 'ready', gid: d.gid });
  if (d.gid === O.lastGid) return;
  O.lastGid = d.gid;
  launchOnline(d);
}
function launchOnline(sm) {
  const host = O.role === 'host', list = host ? S.fighters : O.roster.fighters;
  const byId = id => list.find(f => f.id === id);
  const t0 = (sm.hostTeam || []).map(byId), t1 = (sm.guestTeam || []).map(byId);
  if (!t0.length || t0.length !== t1.length || t0.some(x => !x) || t1.some(x => !x)) { toast('No se encontraron los personajes de la partida'); return; }
  const arenas = host ? S.arenas : O.roster.arenas;
  const arena = arenas.find(a => a.id === sm.arenaId) || arenas[0];
  if (!host) { O.savedStatus = S.settings.status; S.settings.status = O.roster.status; }
  RNG = seeded(sm.seed >>> 0);
  B.online = { side: host ? 0 : 1, gid: sm.gid, turn: 0, acts: {}, mine: {}, hpAt: {}, waiting: false, ended: false, warned: false };
  showView('battle');
  startBattle({ teams: [t0.map(clone), t1.map(clone)], arena });
}
function onAct(d) {
  const o = B.online;
  if (!o || d.gid !== o.gid || d.side !== 1 - o.side || !Array.isArray(d.acts) || !Number.isInteger(d.turn)) return;
  (o.acts[d.turn] = o.acts[d.turn] || {})[d.side] = d.acts.slice(0, 2);
  if (!o.warned && o.hpAt[d.turn] && d.hp && d.hp !== o.hpAt[d.turn]) { o.warned = true; toast('⚠️ La partida se ha desincronizado. Volved a la sala y empezad otra vez.'); }
  if (o.waiting) tryResolveOnline();
}
function canTransformCore(C) {
  const tf = C.f.transform;
  return tf && tf.enabled && !C.transformed && !C.fainted && !B.megaUsed[C.side] && (tf.when === 'always' || C.hp / C.max <= .5);
}
function onlineSubmit() {
  const o = B.online, t = o.turn;
  const acts = B.pending.map(a => ({ slot: a.C.slot, mi: a.mi, t: a.target ? B.units.indexOf(a.target) : -1, mega: !!a.mega }));
  o.mine[t] = { t: 'act', gid: o.gid, turn: t, side: o.side, acts, hp: o.hpAt[t] };
  (o.acts[t] = o.acts[t] || {})[o.side] = acts;
  send(o.mine[t]);
  B.busy = true; o.waiting = true;
  setMoves(false); $('#fleeBtn').disabled = false;
  $$('#arena .hud').forEach(h => h.classList.remove('active'));
  $('#moves').innerHTML = '';
  $('#msg').textContent = 'Esperando a que tu rival elija…';
  tryResolveOnline();
}
function tryResolveOnline() {
  const o = B.online; if (!o || !o.waiting || o.ended) return;
  const A = o.acts[o.turn];
  if (!A || !A[0] || !A[1]) return;
  o.waiting = false;
  const list = [];
  for (const side of [0, 1]) {
    let megaTaken = false;
    for (const e of A[side]) {
      const C = B.units.find(u => u.side === side && u.slot === e.slot);
      if (!C || C.fainted || C.charging) continue;
      const mi = Number.isInteger(e.mi) && e.mi >= 0 && e.mi < C.f.attacks.length ? e.mi : 0;
      const target = Number.isInteger(e.t) && e.t >= 0 && e.t < B.units.length ? B.units[e.t] : null;
      const mega = !!e.mega && !megaTaken && canTransformCore(C);
      if (mega) megaTaken = true;
      list.push({ C, mi, target, mega });
    }
  }
  resolveTurn(list.concat(B.forced));
}
function onlineBattleEnded() { if (B.online) B.online.ended = true; }
function onlineBackToRoom() {
  RNG = Math.random;
  if (O.savedStatus) { S.settings.status = O.savedStatus; O.savedStatus = null; }
  B.online = null; O.pendingStart = null; O.msg = '';
  B.mode = 'online';
  renderSetup();
}
function onlineQuit() { if (B.online) send({ t: 'bye' }); leaveBattle(); }
async function onlineCloseRoom() { return closeOnline(false); }
async function closeOnline(silent) {
  if (!silent && O.conn) { await send({ t: 'bye' }); await wait(150); }
  try { if (O.conn) O.conn.close(); } catch (e) {}
  try { if (O.peer) O.peer.destroy(); } catch (e) {}
  const keepMsg = silent ? O.msg : '';
  Object.assign(O, { phase: 'idle', role: null, code: '', peer: null, conn: null, opTeam: [], cfg: null, roster: null, incoming: null, pendingStart: null, deferStart: null, lastGid: null, msg: keepMsg, sending: false });
  if (B.online) { RNG = Math.random; if (O.savedStatus) { S.settings.status = O.savedStatus; O.savedStatus = null; } B.online = null; }
  renderSetup();
}
setInterval(() => { const o = B.online; if (o && O.conn) for (const t of [o.turn - 1, o.turn]) if (o.mine[t]) send(o.mine[t]); }, 2500);
window.addEventListener('beforeunload', () => { try { if (O.conn) O.conn.send({ t: 'bye' }); } catch (e) {} });

$('#onlineArea').addEventListener('click', async e => {
  const t = e.target.closest('[data-on],[data-oteam],[data-oformat],[data-oarena]'); if (!t) return;
  sfx('select');
  if (t.dataset.oteam) {
    const n = O.phase === 'hosting' ? onNeed() : (O.cfg && O.cfg.format === 'double' ? 2 : 1);
    if (n === 1) O.myTeam = [t.dataset.oteam]; else { O.myTeam.push(t.dataset.oteam); while (O.myTeam.length > 2) O.myTeam.shift(); }
    if (O.role === 'host') sendCfg(); else if (O.myTeam.length === n) send({ t: 'pick', team: O.myTeam });
    return renderOnline();
  }
  if (t.dataset.oformat) {
    O.format = t.dataset.oformat;
    O.myTeam = O.myTeam.filter(id => getF(id)).slice(-onNeed());
    for (let k = 0; O.myTeam.length < onNeed() && S.fighters.length; k++) O.myTeam.push(S.fighters[k % S.fighters.length].id);
    O.opTeam = []; sendCfg(); return renderOnline();
  }
  if (t.dataset.oarena) { O.arenaId = t.dataset.oarena; sendCfg(); return renderOnline(); }
  const act = t.dataset.on;
  if (act === 'host') {
    if (O.busy) return; O.busy = true; O.msg = 'Creando la partida…'; O.phase = 'connecting'; renderOnline();
    try {
      let peer = null, code = '';
      for (let k = 0; k < 5 && !peer; k++) {
        code = randCode();
        try { peer = await openPeer(PEER_PREFIX + code); } catch (err) { if (!(err && err.type === 'unavailable-id')) throw err; }
      }
      if (!peer) throw new Error('noid');
      O.peer = peer; O.code = code; O.role = 'host';
      peer.on('connection', conn => {
        if (O.conn && O.conn.open) { conn.on('open', () => { try { conn.send({ t: 'full' }); } catch (e) {} setTimeout(() => conn.close(), 500); }); return; }
        attachConn(conn);
      });
      peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
      O.phase = 'hosting'; O.msg = '';
      O.myTeam = S.fighters.slice(0, onNeed()).map(f => f.id); O.arenaId = O.arenaId || S.arenas[0].id;
    } catch (err) { O.phase = 'idle'; O.msg = 'No se pudo crear la partida. Comprueba tu conexión a internet.'; }
    O.busy = false; return renderOnline();
  }
  if (act === 'joinCode') {
    const code = ($('#codeIn').value || '').trim().toLowerCase();
    if (!/^[a-z0-9]{4}$/.test(code)) { O.msg = 'Escribe un código de 4 letras.'; return renderOnline(); }
    if (O.busy) return; O.busy = true; O.msg = 'Buscando la partida…'; O.phase = 'connecting'; renderOnline();
    try {
      const peer = await openPeer(null);
      O.peer = peer; O.code = code; O.role = 'guest'; O.myTeam = [];
      const conn = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' });
      attachConn(conn);
      await new Promise((res, rej) => {
        if (conn.open) return res();
        const to = setTimeout(() => rej(new Error('timeout')), 15000);
        peer.on('error', err => { clearTimeout(to); rej(err); });
        conn.on('open', () => { clearTimeout(to); res(); });
      });
      O.phase = 'joined'; O.msg = '';
    } catch (err) {
      O.msg = err && err.type === 'peer-unavailable' ? 'No hay ninguna partida con ese código.' : 'No se pudo conectar con la partida. Comprueba el código y tu conexión.';
      try { O.peer && O.peer.destroy(); } catch (e) {}
      O.phase = 'idle'; O.peer = null;
    }
    O.busy = false; return renderOnline();
  }
  if (act === 'start') {
    if (O.pendingStart || !connected()) return;
    if (O.sig !== rosterSig()) { O.msg = 'Enviando tus cambios a tu rival…'; O.sending = true; renderOnline(); await sendRoster(); O.sending = false; O.msg = ''; }
    O.pendingStart = { t: 'start', gid: uid(), seed: Math.floor(Math.random() * 4294967296), format: O.format, arenaId: O.arenaId, hostTeam: O.myTeam.slice(), guestTeam: O.opTeam.slice(), ver: O.ver };
    send(O.pendingStart);
    return renderOnline();
  }
  if (act === 'close') return closeOnline(false);
});
$('#onlineArea').addEventListener('keydown', e => { if (e.target.id === 'codeIn' && e.key === 'Enter') $('[data-on="joinCode"]').click(); });

/* =========================================================
   Exportar / importar / restaurar
   ========================================================= */
const DL = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function exportData() {
  const used = usedMedia(S), media = {};
  for (const id of used) {
    const v = MEDIA[id]; if (!v) continue;
    media[id] = v instanceof Blob ? await blobToDataURL(v) : v;
  }
  return { app: 'arena-combates', v: 3, fighters: S.fighters, arenas: S.arenas, settings: { ...S.settings, muted: false }, media };
}
async function doExport() {
  toast('Preparando la exportación…');
  const json = JSON.stringify(await exportData());
  const dl = await Promise.race([DL, wait(1500).then(() => null)]);
  if (dl) {
    try { await dl.save({ filename: 'arena-combates.json', data: new Blob([json], { type: 'application/json' }) }); toast('Archivo guardado ✔'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  try {
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = 'pokemdk.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast('Archivo descargado ✔'); return;
  } catch (e) {}
  openModal(`<h3>Exportar</h3>
    <p class="tip" style="margin:0 0 10px">Copia este texto y guárdalo en un archivo <b>arena-combates.json</b>. Incluye imágenes, sonidos y vídeos (${(json.length / 1048576).toFixed(1)} MB).</p>
    <textarea id="expTxt" readonly></textarea>
    <div class="row"><button class="btn" data-close>Cerrar</button><button class="btn primary" id="copyBtn">Copiar</button></div>`);
  $('#expTxt').value = json.length > 3e6 ? json.slice(0, 3e6) + '\n… (demasiado grande para mostrarlo entero: usa Copiar)' : json;
  $('#copyBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(json); toast('Copiado al portapapeles ✔'); }
    catch (e) { $('#expTxt').select(); toast('Selecciona el texto y pulsa Ctrl+C'); }
  };
}
function doImport() {
  openModal(`<h3>Importar</h3>
    <p class="tip" style="margin:0 0 10px">Elige el archivo .json exportado (o pega su contenido).</p>
    <input type="file" accept=".json,application/json,text/plain" id="impFile" style="margin-bottom:10px">
    <textarea id="impTxt" placeholder='{"app":"arena-combates", ...}'></textarea>
    <div class="row"><button class="btn" data-close>Cancelar</button><button class="btn" id="impAdd">Añadir a lo que tengo</button><button class="btn primary" id="impRep">Reemplazar todo</button></div>`);
  let fileText = null;
  $('#impFile').onchange = e => { const fl = e.target.files[0]; if (fl) fl.text().then(t => { fileText = t; $('#impTxt').value = t.length > 2e6 ? '(archivo cargado: ' + (t.length / 1048576).toFixed(1) + ' MB)' : t; }); };
  const go = async replace => {
    let d;
    try { d = JSON.parse(fileText || $('#impTxt').value); } catch (e) { return toast('Ese texto no es una exportación válida'); }
    const fighters = (Array.isArray(d) ? d : d.fighters || []).map(x => normFighter({ ...x, id: null }));
    const arenas = (d.arenas || []).map(x => normArena({ ...x, id: null }));
    if (!fighters.length && !arenas.length) return toast('No hay personajes ni escenarios en ese archivo');
    for (const [id, val] of Object.entries(d.media || {})) {
      if (/^[a-z0-9]+$/.test(id) && typeof val === 'string' && val.startsWith('data:')) {
        MEDIA[id] = val;
        try { await idb('media', 'readwrite', st => st.put(val, id)); } catch (e) {}
      }
    }
    if (replace) {
      S.fighters = fighters;
      S.arenas = arenas.length ? arenas : defaultArenas();
      if (d.settings) S.settings = normSettings({ ...d.settings, muted: S.settings.muted });
    } else { S.fighters = S.fighters.concat(fighters); S.arenas = S.arenas.concat(arenas); }
    ed.sel = fighters[0]?.id || ed.sel; edA.sel = arenas[0]?.id || edA.sel;
    save(true); closeModal(); renderEditor(); renderArenaEditor();
    toast(`Importado: ${fighters.length} personaje(s) y ${arenas.length} escenario(s) ✔`);
  };
  $('#impAdd').onclick = () => go(false);
  $('#impRep').onclick = () => go(true);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-io]'); if (!b) return;
  const io = b.dataset.io;
  if (io === 'export') doExport();
  else if (io === 'import') doImport();
  else if (io === 'reset') {
    if (!b.classList.contains('armed')) {
      b.classList.add('armed'); b.textContent = '¿Borrar todo?';
      setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Restaurar demo'; }, 3000);
      return;
    }
    S.fighters = defaultFighters(); S.arenas = defaultArenas();
    ed.sel = null; edA.sel = null; save(true); renderEditor();
    b.classList.remove('armed'); b.textContent = 'Restaurar demo';
    toast('Contenido de demostración restaurado');
  }
});

/* =========================================================
   Arranque
   ========================================================= */
(async function init() {
  DB.db = await idbOpen();
  let loaded = false;
  if (DB.db) {
    try {
      const [keys, vals] = await Promise.all([
        idb('media', 'readonly', st => st.getAllKeys()),
        idb('media', 'readonly', st => st.getAll())
      ]);
      (keys || []).forEach((k, i) => { MEDIA[k] = vals[i]; });
      const st = await idb('kv', 'readonly', s => s.get('state'));
      if (st && Array.isArray(st.fighters)) {
        S = { v: 5, fighters: st.fighters.map(normFighter), arenas: (st.arenas || []).map(normArena), settings: normSettings(st.settings) };
        if (!S.arenas.length) S.arenas = defaultArenas();
        if ((st.v || 2) < 3 && !S.fighters.some(f => f.name === 'Gotarín')) {
          const extra = defaultFighters();
          const bra = S.fighters.find(f => f.img === 'art:brasilo');
          if (bra && !bra.transform.enabled) bra.transform = extra[0].transform;
          S.fighters.push(extra[2]);
          save(true);
        }
        if ((st.v || 2) < 5 && !S.fighters.some(f => f.name === 'Espejín')) {
          S.fighters.push(espejinDemo());
          save(true);
        }
        loaded = true;
      }
    } catch (e) {}
  }
  if (!loaded) {
    try {
      const old = localStorage.getItem('arena-combates-v1');
      if (old) {
        S.fighters = (JSON.parse(old).fighters || []).map(normFighter);
        if (!S.fighters.length) S.fighters = defaultFighters();
        save(true);
      }
    } catch (e) {}
  }
  paintSound();
  renderSetup();
})();
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
